<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Happy Birthday Areeba 🎂</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --pink1: #ffd6e7;
    --pink2: #ffb3d1;
    --pink3: #ff85b3;
    --pink4: #ff4d94;
    --pink5: #e91e8c;
    --cream: #fff9fb;
    --gold: #ffd700;
  }

  body {
    width: 100vw; height: 100vh; overflow: hidden;
    font-family: 'Nunito', sans-serif;
    background: linear-gradient(135deg, #fff0f7 0%, #ffd6e7 50%, #fff0f7 100%);
    touch-action: none;
  }

  /* ======= FLOATING HEARTS BG ======= */
  .hearts-bg { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .heart-float {
    position: absolute;
    font-size: clamp(14px, 3vw, 28px);
    animation: floatUp linear infinite;
    opacity: 0;
  }
  @keyframes floatUp {
    0%   { transform: translateY(110vh) scale(0.5) rotate(-15deg); opacity: 0; }
    10%  { opacity: 0.7; }
    90%  { opacity: 0.5; }
    100% { transform: translateY(-10vh) scale(1.2) rotate(15deg); opacity: 0; }
  }

  /* ======= ENTRY SCREEN ======= */
  #entry-screen {
    position: fixed; inset: 0; z-index: 100;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: linear-gradient(160deg, #fff0f7, #ffd6e7, #ffb3d1);
    transition: opacity 0.8s ease, transform 0.8s ease;
  }
  #entry-screen.exit {
    opacity: 0; transform: scale(1.1);
    pointer-events: none;
  }
  .entry-title {
    font-family: 'Pacifico', cursive;
    font-size: clamp(2.5rem, 8vw, 5rem);
    color: var(--pink5);
    text-shadow: 2px 4px 0 rgba(255,77,148,0.2), 0 0 30px rgba(255,77,148,0.3);
    animation: pulse 2s ease-in-out infinite;
    text-align: center; padding: 0 20px;
    line-height: 1.2;
  }
  .entry-subtitle {
    font-size: clamp(1rem, 3vw, 1.4rem);
    color: var(--pink4); margin-top: 10px;
    letter-spacing: 2px; text-align: center;
    animation: pulse 2s ease-in-out infinite 0.5s;
  }
  @keyframes pulse {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }
  .enter-btn {
    margin-top: 40px;
    padding: clamp(14px,3vw,20px) clamp(40px,8vw,70px);
    font-family: 'Pacifico', cursive;
    font-size: clamp(1.1rem, 3.5vw, 1.6rem);
    color: white;
    background: linear-gradient(135deg, var(--pink4), var(--pink5));
    border: none; border-radius: 50px; cursor: pointer;
    box-shadow: 0 8px 25px rgba(233,30,140,0.4), 0 0 0 4px rgba(255,180,220,0.4);
    animation: btnPulse 1.5s ease-in-out infinite;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .enter-btn:hover { transform: scale(1.07); box-shadow: 0 12px 35px rgba(233,30,140,0.55); }
  .enter-btn:active { transform: scale(0.95); }
  @keyframes btnPulse {
    0%,100% { box-shadow: 0 8px 25px rgba(233,30,140,0.4), 0 0 0 4px rgba(255,180,220,0.4); }
    50% { box-shadow: 0 8px 25px rgba(233,30,140,0.4), 0 0 0 10px rgba(255,180,220,0.15); }
  }
  .entry-emojis { font-size: clamp(2rem,5vw,3.5rem); margin-top: 20px; animation: wobble 2s ease-in-out infinite; }
  @keyframes wobble {
    0%,100% { transform: rotate(-5deg); }
    50% { transform: rotate(5deg); }
  }

  /* ======= BIRTHDAY SCREEN ======= */
  #birthday-screen {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.8s ease 0.3s;
  }
  #birthday-screen.visible { opacity: 1; pointer-events: all; }

  /* ======= SPARKLES ======= */
  .sparkle {
    position: fixed; pointer-events: none; z-index: 5;
    font-size: clamp(10px,2vw,20px);
    animation: sparkleDrift linear infinite;
    opacity: 0;
  }
  @keyframes sparkleDrift {
    0%   { transform: translate(0,0) rotate(0deg) scale(0.5); opacity: 0; }
    20%  { opacity: 1; }
    80%  { opacity: 0.8; }
    100% { transform: translate(var(--dx),var(--dy)) rotate(360deg) scale(1.2); opacity: 0; }
  }

  /* ======= RIBBONS ======= */
  .ribbon {
    position: fixed; pointer-events: none; z-index: 4;
    width: clamp(30px,5vw,60px); height: clamp(8px,1.5vw,15px);
    border-radius: 50%; animation: ribbonDrift ease-in-out infinite;
    opacity: 0.7;
  }
  @keyframes ribbonDrift {
    0%   { transform: translateY(0) rotate(0deg); opacity: 0.7; }
    50%  { transform: translateY(-20px) rotate(180deg); opacity: 0.5; }
    100% { transform: translateY(0) rotate(360deg); opacity: 0.7; }
  }

  /* ======= CAKE SCENE ======= */
  .cake-scene {
    position: relative;
    width: clamp(200px, 55vw, 340px);
    height: clamp(200px, 55vw, 340px);
    display: flex; align-items: flex-end; justify-content: center;
    z-index: 20;
  }
  .cake-wrap { position: relative; }

  /* Cake SVG base */
  .cake-svg { display: block; filter: drop-shadow(0 10px 30px rgba(255,77,148,0.35)); }

  /* Candle flicker */
  .flame { animation: flicker 0.5s ease-in-out infinite alternate; transform-origin: center bottom; }
  .flame:nth-child(2) { animation-delay: 0.17s; }
  .flame:nth-child(3) { animation-delay: 0.33s; }
  @keyframes flicker {
    0%   { transform: scaleX(1) scaleY(1) translateY(0); opacity: 1; }
    25%  { transform: scaleX(0.8) scaleY(1.1) translateY(-1px); opacity: 0.95; }
    50%  { transform: scaleX(1.1) scaleY(0.9) translateY(1px); opacity: 0.9; }
    75%  { transform: scaleX(0.9) scaleY(1.05) translateY(-1px); opacity: 0.95; }
    100% { transform: scaleX(1.05) scaleY(1.1) translateY(-2px); opacity: 1; }
  }

  /* Cake cut overlay */
  .cake-cut-overlay {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%; pointer-events: none; z-index: 25;
    opacity: 0; transition: opacity 0.5s;
  }
  .cake-cut-overlay.show { opacity: 1; }

  /* ======= KNIFE ======= */
  #knife {
    position: fixed;
    z-index: 50;
    width: clamp(80px,18vw,130px);
    cursor: grab;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,0.25));
    transform: rotate(-30deg);
    transform-origin: center center;
    transition: filter 0.2s;
    touch-action: none;
    user-select: none;
  }
  #knife:active { cursor: grabbing; filter: drop-shadow(0 6px 18px rgba(233,30,140,0.4)); }
  #knife.on-cake { filter: drop-shadow(0 0 15px rgba(255,200,50,0.8)); }

  /* ======= LOVE MESSAGE ======= */
  #love-msg {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 200; text-align: center;
    opacity: 0; pointer-events: none;
    width: 90vw; max-width: 500px;
  }
  #love-msg.show { animation: msgAppear 1.2s ease forwards; }
  @keyframes msgAppear {
    0%   { opacity: 0; transform: translate(-50%,-50%) scale(0.5); }
    60%  { opacity: 1; transform: translate(-50%,-50%) scale(1.1); }
    80%  { transform: translate(-50%,-50%) scale(0.96); }
    100% { opacity: 1; transform: translate(-50%,-50%) scale(1); }
  }
  .msg-box {
    background: rgba(255,255,255,0.92);
    border: 3px solid var(--pink3);
    border-radius: 30px;
    padding: clamp(20px,5vw,40px) clamp(25px,6vw,50px);
    box-shadow: 0 20px 60px rgba(233,30,140,0.25), inset 0 0 30px rgba(255,180,220,0.2);
    backdrop-filter: blur(10px);
  }
  .msg-text {
    font-family: 'Pacifico', cursive;
    font-size: clamp(1.3rem,5vw,2.2rem);
    color: var(--pink5);
    animation: shimmer 2s linear infinite, bounce 1s ease-in-out infinite;
    background: linear-gradient(90deg, var(--pink5), #ff9900, var(--pink5));
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1.4;
  }
  @keyframes shimmer { 0%{background-position:0%} 100%{background-position:200%} }
  @keyframes bounce {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
  }
  .msg-emojis { font-size: clamp(1.8rem,5vw,3rem); margin-top: 10px; display: block; animation: spin 3s linear infinite; }
  @keyframes spin { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }

  /* ======= FIREWORKS ======= */
  #fireworks { position: fixed; inset: 0; pointer-events: none; z-index: 150; }

  /* ======= HINT ======= */
  #hint {
    position: fixed; bottom: clamp(15px,4vw,30px); left: 50%;
    transform: translateX(-50%);
    background: rgba(255,255,255,0.8);
    border: 2px solid var(--pink3);
    border-radius: 20px; padding: 10px 24px;
    font-size: clamp(0.75rem,2.5vw,1rem);
    color: var(--pink5); font-weight: 700;
    animation: hintBounce 1.5s ease-in-out infinite;
    z-index: 60; white-space: nowrap;
  }
  @keyframes hintBounce {
    0%,100% { transform: translateX(-50%) translateY(0); }
    50% { transform: translateX(-50%) translateY(-5px); }
  }

  /* ======= BIRTHDAY TITLE ======= */
  .bday-title {
    font-family: 'Pacifico', cursive;
    font-size: clamp(1.5rem,5.5vw,3rem);
    color: var(--pink5);
    text-shadow: 2px 3px 0 rgba(255,77,148,0.2);
    margin-bottom: clamp(8px,2vw,20px);
    text-align: center;
    animation: titleFloat 3s ease-in-out infinite;
  }
  @keyframes titleFloat {
    0%,100% { transform: translateY(0) rotate(-1deg); }
    50% { transform: translateY(-6px) rotate(1deg); }
  }
</style>
</head>
<body>

<!-- Floating hearts BG -->
<div class="hearts-bg" id="hearts-bg"></div>

<!-- ENTRY SCREEN -->

  <div class="entry-title">Happy Birthday<br>Areeba! 🎀</div>
  <div class="entry-subtitle">✨ A special surprise awaits ✨</div>
  <div class="entry-emojis">🎂💖🎉</div>

</div>

<script>
// ============================================================
// HEARTS BACKGROUND
// ============================================================
const heartsBg = document.getElementById('hearts-bg');
const heartEmojis = ['💕','💗','💖','💝','💓','♥','🌸','✨'];
for (let i = 0; i < 18; i++) {
  const h = document.createElement('div');
  h.className = 'heart-float';
  h.textContent = heartEmojis[Math.floor(Math.random()*heartEmojis.length)];
  h.style.left = Math.random()*100 + 'vw';
  h.style.animationDuration = (8 + Math.random()*10) + 's';
  h.style.animationDelay = (-Math.random()*15) + 's';
  h.style.fontSize = (12 + Math.random()*20) + 'px';
  heartsBg.appendChild(h);
}

// ============================================================
// ENTRY → BIRTHDAY TRANSITION
// ============================================================
let birthdayStarted = false;
function enterBirthday() {
  if (birthdayStarted) return;
  birthdayStarted = true;
  document.getElementById('entry-screen').classList.add('exit');
  setTimeout(() => {
    document.getElementById('entry-screen').style.display = 'none';
    const bs = document.getElementById('birthday-screen');
    bs.classList.add('visible');
    placeKnife();
    spawnSparkles();
    spawnRibbons();
    playBirthdaySong();
  }, 600);
}

// ============================================================
// PLACE KNIFE
// ============================================================
function placeKnife() {
  const knife = document.getElementById('knife');
  const vw = window.innerWidth, vh = window.innerHeight;
  knife.style.left = (vw * 0.05) + 'px';
  knife.style.top = (vh * 0.65) + 'px';
}

// ============================================================
// SPARKLES
// ============================================================
const sparkleEmojis = ['✨','⭐','🌟','💫','🌸','⚡'];
function spawnSparkles() {
  for (let i = 0; i < 14; i++) {
    const s = document.createElement('div');
    s.className = 'sparkle';
    s.textContent = sparkleEmojis[Math.floor(Math.random()*sparkleEmojis.length)];
    const cx = window.innerWidth/2, cy = window.innerHeight/2;
    const radius = Math.min(window.innerWidth, window.innerHeight) * 0.38;
    const angle = (i / 14) * Math.PI * 2;
    s.style.left = (cx + Math.cos(angle)*radius*(0.6+Math.random()*0.6)) + 'px';
    s.style.top = (cy + Math.sin(angle)*radius*(0.6+Math.random()*0.6)) + 'px';
    const dx = (Math.random()-0.5)*80 + 'px';
    const dy = (Math.random()-0.5)*80 + 'px';
    s.style.setProperty('--dx', dx);
    s.style.setProperty('--dy', dy);
    s.style.animationDuration = (3 + Math.random()*4) + 's';
    s.style.animationDelay = (-Math.random()*5) + 's';
    document.body.appendChild(s);
  }
}

// AUDIO — Birthday Song (Web Audio API beep melody)
// ============================================================
let audioCtx = null;
function playBirthdaySong() {
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    // Happy Birthday notes (freq, duration in s)
    const notes = [
      [261,0.3],[261,0.15],[293,0.45],[261,0.45],[349,0.45],[329,0.9],
      [261,0.3],[261,0.15],[293,0.45],[261,0.45],[392,0.45],[349,0.9],
      [261,0.3],[261,0.15],[523,0.45],[440,0.45],[349,0.45],[329,0.45],[293,0.9],
      [466,0.3],[466,0.15],[440,0.45],[349,0.45],[392,0.45],[349,0.9]
    ];
    let t = audioCtx.currentTime + 0.3;
    notes.forEach(([freq, dur]) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, t);
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(0.18, t+0.02);
      gain.gain.linearRampToValueAtTime(0, t+dur-0.03);
      osc.start(t); osc.stop(t+dur);
      t += dur + 0.02;
    });
  } catch(e) { console.log('Audio:', e); }
}

// ============================================================
// KNIFE DRAG (mouse + touch)
// ============================================================
const knife = document.getElementById('knife');
let dragging = false, startX, startY, kStartX, kStartY;
let cakeCut = false;

function onDragStart(e) {
  dragging = true;
  const pt = e.touches ? e.touches[0] : e;
  startX = pt.clientX; startY = pt.clientY;
  const rect = knife.getBoundingClientRect();
  kStartX = rect.left; kStartY = rect.top;
  knife.style.transition = 'none';
  e.preventDefault();
}
function onDragMove(e) {
  if (!dragging) return;
  const pt = e.touches ? e.touches[0] : e;
  const dx = pt.clientX - startX, dy = pt.clientY - startY;
  knife.style.left = (kStartX + dx) + 'px';
  knife.style.top = (kStartY + dy) + 'px';
  if (!cakeCut) checkCakeCollision(pt.clientX, pt.clientY);
  e.preventDefault();
}
function onDragEnd(e) { dragging = false; }

knife.addEventListener('mousedown', onDragStart);
knife.addEventListener('touchstart', onDragStart, { passive: false });
document.addEventListener('mousemove', onDragMove);
document.addEventListener('touchmove', onDragMove, { passive: false });
document.addEventListener('mouseup', onDragEnd);
document.addEventListener('touchend', onDragEnd);

function checkCakeCollision(mx, my) {
  const cakeEl = document.getElementById('cake-svg');
  const rect = cakeEl.getBoundingClientRect();
  const cx = rect.left + rect.width/2;
  const cy = rect.top + rect.height/2;
  const dist = Math.hypot(mx-cx, my-cy);
  const threshold = rect.width * 0.45;
  if (dist < threshold) {
    knife.classList.add('on-cake');
    cutCake();
  }
}

function cutCake() {
  if (cakeCut) return;
  cakeCut = true;
  // Cut overlay
  document.getElementById('cut-overlay').classList.add('show');
  // Shake knife
  knife.style.transform = 'rotate(-10deg) scale(1.1)';
  setTimeout(() => { knife.style.transform = 'rotate(-30deg)'; }, 300);
  // Show message
  setTimeout(() => {
    document.getElementById('love-msg').classList.add('show');
    document.getElementById('hint').style.display = 'none';
  }, 500);
  // Fireworks
  startFireworks();
}

// ============================================================
// FIREWORKS
// ============================================================
const fwCanvas = document.getElementById('fireworks');
const fwCtx = fwCanvas.getContext('2d');
let fwActive = false;
const particles = [];

function resizeFW() {
  fwCanvas.width = window.innerWidth;
  fwCanvas.height = window.innerHeight;
}
resizeFW();
window.addEventListener('resize', resizeFW);

class Particle {
  constructor(x, y, color) {
    this.x = x; this.y = y; this.color = color;
    const angle = Math.random() * Math.PI * 2;
    const speed = 2 + Math.random() * 6;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.alpha = 1;
    this.radius = 2 + Math.random() * 3;
    this.gravity = 0.12;
    this.trail = [];
  }
  update() {
    this.trail.push({x: this.x, y: this.y});
    if (this.trail.length > 5) this.trail.shift();
    this.vy += this.gravity;
    this.x += this.vx; this.y += this.vy;
    this.vx *= 0.98; this.alpha -= 0.018;
  }
  draw(ctx) {
    ctx.save();
    ctx.globalAlpha = this.alpha;
    ctx.fillStyle = this.color;
    ctx.shadowBlur = 8; ctx.shadowColor = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
}

const fwColors = ['#ff4d94','#ffd700','#ff85b3','#ff6b6b','#00e5ff','#76ff03','#e040fb','#fff'];
function launchFirework() {
  const x = 0.1*fwCanvas.width + Math.random()*0.8*fwCanvas.width;
  const y = 0.05*fwCanvas.height + Math.random()*0.5*fwCanvas.height;
  const color = fwColors[Math.floor(Math.random()*fwColors.length)];
  for (let i = 0; i < 60; i++) particles.push(new Particle(x, y, color));
}

let fwInterval, fwRaf;
function startFireworks() {
  fwActive = true;
  launchFirework(); launchFirework(); launchFirework();
  fwInterval = setInterval(() => { launchFirework(); launchFirework(); }, 600);
  setTimeout(() => { clearInterval(fwInterval); }, 8000);
  animFW();
}
function animFW() {
  if (!fwActive && particles.length === 0) return;
  fwCtx.clearRect(0, 0, fwCanvas.width, fwCanvas.height);
  for (let i = particles.length-1; i >= 0; i--) {
    particles[i].update();
    particles[i].draw(fwCtx);
    if (particles[i].alpha <= 0) particles.splice(i,1);
  }
  requestAnimationFrame(animFW);
}
